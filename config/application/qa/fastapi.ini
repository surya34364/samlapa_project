; Package: fastapi — HTTP server, FastAPI, CORS, health (safe in git)
; Used by: create_app_from_settings(), uvicorn_kwargs_from_settings()
; Lists: comma-separated (origins = http://a.com, http://b.com)
; Disable docs: docs_url = (empty) or none

; ===========================================================================
; [app] — Service identity (logging, metadata; safe in git)
; ===========================================================================
[app]
; Logical service name in logs and dashboards.
name = my-service
; Semantic version exposed in OpenAPI and health metadata.
version = 0.1.0
; Short human-readable summary of this API.
description = FinMkt HTTP API
; true = verbose errors and FastAPI debug; false in qa/prod.
debug = true
; Optional: overrides [fastapi] title in OpenAPI if set.
; title = My Custom API Title
; Optional: mount all routers under this path (e.g. /api/v1).
; url_prefix = /api/v1

; ===========================================================================
; [server] — Uvicorn process (uvicorn.run **uvicorn_kwargs_from_settings())
; ===========================================================================
[server]
; Bind address: 127.0.0.1 (local only) or 0.0.0.0 (all interfaces).
host = 127.0.0.1
; TCP port clients connect to.
port = 8000
; true = auto-reload on code change (dev only; forces workers=1).
reload = true
; Process count; use 1 when reload=true; increase in prod.
workers = 1
; Uvicorn log level: critical, error, warning, info, debug, trace.
log_level = debug
; true = log each HTTP request line.
access_log = true
; true = trust X-Forwarded-* when behind reverse proxy / load balancer.
proxy_headers = true
; IPs allowed to send forwarded headers (* = any; tighten in prod).
forwarded_allow_ips = *
; Seconds to keep idle HTTP connections open.
timeout_keep_alive = 5
; Max concurrent connections (empty = unlimited).
limit_concurrency =
; Restart worker after N requests (empty = unlimited).
limit_max_requests =
; TLS: paths to key/cert files (both required to enable HTTPS).
; ssl_keyfile =
; ssl_certfile =
; ASGI root_path when app sits behind a path-prefixing proxy.
root_path =

; ===========================================================================
; [fastapi] — FastAPI app (create_app_from_settings)
; ===========================================================================
[fastapi]
; OpenAPI title shown in /docs.
title = FinMkt API
; API version string in OpenAPI info block.
version = 0.1.0
; Longer description in OpenAPI (supports plain text).
description = FinMkt HTTP API
; URL path prefix for every mounted router (empty = root).
url_prefix =
; Proxy root_path for OpenAPI behind reverse proxy (usually empty locally).
root_path =
; Swagger UI path; empty or "none" disables docs.
docs_url = /docs
; ReDoc path; empty or "none" disables ReDoc.
redoc_url = /redoc
; OpenAPI JSON path; empty or "none" disables schema export.
openapi_url = /openapi.json
; Optional terms-of-service URL in OpenAPI info.
terms_of_service =
; Contact block in OpenAPI (optional).
contact_name =
contact_email =

; ===========================================================================
; [cors] — Cross-Origin Resource Sharing (comma-separated lists)
; ===========================================================================
[cors]
; Allowed browser origins, or * for all. Example: https://app.example.com
origins = http://localhost:3000, http://127.0.0.1:5173, http://localhost:8000
; Regex for origins (optional); leave empty to use origins list only.
allow_origin_regex =
; HTTP methods browsers may use; comma-separated or *.
allow_methods = GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD
; Request headers browsers may send; * allows all.
allow_headers = *
; Response headers exposed to browser JS; comma-separated or empty.
expose_headers =
; true = allow cookies / Authorization in cross-origin requests.
allow_credentials = true
; Preflight cache duration in seconds.
max_age = 600

; ===========================================================================
; [security] — Authentication integration
; ===========================================================================
[security]
; true = use ZITADEL JWT/session deps; false = guest user for local dev.
zitadel_enabled = true
; Comma-separated Host header values (enables TrustedHostMiddleware).
; trusted_hosts = localhost, 127.0.0.1, api.example.com

; ===========================================================================
; [health] — Kubernetes / load-balancer liveness
; ===========================================================================
[health]
; false = do not register a health route.
enabled = true
; Path returning {"status":"ok"} (must start with /).
path = /health

; ===========================================================================
; [http] — Timeouts and payload limits (use in your middleware/services)
; ===========================================================================
[http]
; Suggested upstream/request timeout in seconds.
request_timeout_seconds = 30
; Suggested max JSON/upload body size in megabytes.
max_request_body_mb = 10
; true = include request id in logs when you add middleware (reserved).
enable_request_id = false

; QA overrides — merged on top of dev defaults when FINMKT_ENV=qa

[app]
debug = false

[server]
host = 0.0.0.0
reload = false
workers = 2
log_level = info

[fastapi]
url_prefix = /api

[cors]
origins = https://qa.example.com

[security]
zitadel_enabled = true
